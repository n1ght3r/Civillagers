name: Feature request
description: Suggest something new for Civillagers.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should villages, guards, chiefs or builders do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what would it make more fun?
