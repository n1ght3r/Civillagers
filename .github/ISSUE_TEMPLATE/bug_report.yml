name: Bug report
description: Report broken or incorrect behaviour in Civillagers.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "26.2"
        - "1.21.1"
        - "1.21"
        - Not listed here
    validations:
      required: true

  - type: dropdown
    id: mod-loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Civillagers version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste latest.log or the crash report, or a link to it.
      render: text
