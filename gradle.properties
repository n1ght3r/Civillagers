org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom and Stonecutter do not support the configuration cache yet.
org.gradle.configuration-cache=false

# The world `runBenchmark` opens, and the seed it is generated with: a world of its own beside the dev
