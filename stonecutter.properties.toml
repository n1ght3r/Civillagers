# Everything that differs per build node. Gradle-only options stay in gradle.properties.
#
# Layered by loader: stonecutter.gradle.kts tags every node with its Minecraft version and its loader,
# so the node `1.21.1-neoforge` reads the top level, then `["1.21.1"]`, what both loaders of that version
# share, and `[neoforge."1.21.1"]`, what only NeoForge has. A key belongs in exactly one table a node
# reads. A loader table is what makes a node: CI finds nodes by it (tools/node_names.py).
mod.id = "civillagers"
mod.name = "Civillagers"
mod.group = "com.civillagers"
mod.version = "0.1.0"

deps.fabric_loader = "0.19.5"
# Pinned to a release rather than a snapshot, so the same commit builds the same jars later.
loomx.loom_version = "1.17.21"

["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]

[fabric."1.21.1"]
# The Fabric jar also covers 1.21; the NeoForge one does not.
mod.mc_compat = ">=1.21 <=1.21.1"

deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.5"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21.1,1.21.2)"

deps.neoforge = "21.1.262"

["26.2.x"]
mod.mc_releases = ["26.2"]

[fabric."26.2.x"]
mod.mc_compat = "~26.2"

deps.fabric_api = "0.161.0+26.2"
deps.modmenu = "20.0.3"

["26.3.x"]
mod.mc_releases = ["26.3"]

[fabric."26.3.x"]
mod.mc_compat = "~26.3"

deps.fabric_api = "0.163.0+26.3"
deps.modmenu = "21.0.0"
